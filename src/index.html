<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#100c24">
<title>Maarrsel</title>
<link rel="icon" href="icons/icon.svg" type="image/svg+xml">
<link rel="stylesheet" href="style.css">
<script defer src="browser.js"></script>
<script defer src="i18n.js"></script>
<script defer src="app.js"></script>
</head>
<body>
<header><strong><span class="mark">✳</span> Maarrsel</strong><button id="open" aria-controls="studio" aria-expanded="false">◐ Настроить</button></header>
<main>
<div class="hero"><div class="eyebrow"><span class="dot"></span> ТВОЁ ПРОСТРАНСТВО</div><div id="clock">00:00</div><div id="date"></div></div>
<section class="surface launch" aria-label="Быстрый запуск">
<form id="search"><span aria-hidden="true">⌕</span><input name="q" aria-label="Поисковый запрос" placeholder="Поиск в Brave" required><button aria-label="Найти">↗</button></form>
<div class="section-title">БЫСТРЫЙ ДОСТУП <button id="add">＋ Добавить</button></div>
<div id="links"></div>
</section>
</main>
<footer>Maarrsel / НОВАЯ ВКЛАДКА</footer>
<aside id="studio" class="surface" hidden aria-label="Настройки внешнего вида">
<div class="studio-head"><div><div class="eyebrow">Maarrsel</div><h1>Внешний вид</h1></div><button id="close" aria-label="Закрыть настройки">×</button></div>
<label class="control">Язык<select id="language"><option value="en">English</option><option value="ru">Русский</option></select></label>
<div class="section-title">ПАЛИТРА</div><div id="presets"></div>
<div class="section-title">МАТЕРИАЛ</div><div id="materials"></div>
<div class="section-title">ОБОИ</div>
<label class="control">Выбрать фото<input id="wall-file" type="file" accept="image/*"></label>
<div id="wall-paste" tabindex="0">Скопируй фото, затем нажми сюда и вставь через <kbd>Ctrl+V</kbd></div>
<div id="wall-options" hidden>
<label class="control"><span>Подстроить панели под фон</span><input id="wall-match" type="checkbox"></label>
<button id="wall-remove">Убрать картинку</button>
</div>
<div class="section-title" id="newtab-title" hidden>НОВАЯ ВКЛАДКА</div>
<label class="control" id="newtab-row" hidden><span>Открывать Maarrsel на новых вкладках</span><input id="replace-newtab" type="checkbox"></label>
<div id="controls"></div>
<button id="reset">Сбросить оформление</button>
<p id="status" role="status"></p>
</aside>
<dialog id="editor"><form id="link-form">
<h2 id="editor-title">Быстрая ссылка</h2>
<label>Название<input name="title" maxlength="32" required></label>
<label>Адрес<input name="url" placeholder="example.com" required></label>
<p id="link-error" role="alert"></p>
<div class="actions"><button type="button" id="remove">Удалить</button><button type="button" id="cancel">Отмена</button><button>Сохранить</button></div>
</form></dialog>
</body>
</html>
