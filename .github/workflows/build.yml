name: Build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run build
      - name: Rename package
        run: |
          version=$(node -p "require('./src/manifest.json').version")
          mv dist/*.zip "dist/Marsel-Glass-Android-${version}.xpi"
      - uses: actions/upload-artifact@v4
        with:
          name: marsel-glass-android
          path: dist/*.xpi
          if-no-files-found: error

  sign:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    env:
      AMO_JWT_ISSUER: ${{ secrets.AMO_JWT_ISSUER }}
      AMO_JWT_SECRET: ${{ secrets.AMO_JWT_SECRET }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - uses: actions/download-artifact@v4
        with:
          name: marsel-glass-android
          path: dist
      - name: Sign with AMO (unlisted)
        if: env.AMO_JWT_ISSUER != '' && env.AMO_JWT_SECRET != ''
        run: |
          npx web-ext sign --source-dir src --artifacts-dir dist-signed --channel unlisted \
            --api-key "$AMO_JWT_ISSUER" --api-secret "$AMO_JWT_SECRET"
      - name: Warn about missing signing secrets
        if: env.AMO_JWT_ISSUER == '' || env.AMO_JWT_SECRET == ''
        run: echo "::warning::AMO_JWT_ISSUER/AMO_JWT_SECRET are not set. Publishing an unsigned build only."
      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            dist/*.xpi
            dist-signed/*.xpi
          fail_on_unmatched_files: false
